<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise Booking Portal | PHL Express</title>
<link rel="icon" type="image/png" href="logo.png">
<script src="https://cdn.tailwindcss.com"></script>

<!-- Firebase SDKs (Database only) -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<!-- EmailJS SDK -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script type="text/javascript">
emailjs.init("fpa1DA0DLYaRkVd0o");
</script>

<script>
tailwind.config = {
theme: {
extend: {
colors: {
navy: { 900: '#0F172A', 950: '#090D16' },
blue: { 600: '#2563EB', 700: '#1D4ED8' }
}
}
}
}
</script>
</head>
<body class="bg-slate-950 font-sans text-slate-300 antialiased min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-slate-950">

<!-- Header -->
<header class="bg-navy-950 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md bg-opacity-90">
<div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
<div class="flex items-center space-x-6">
<div class="flex items-center space-x-3">
<img src="logo.png" alt="Logo" class="h-10 w-10 rounded-xl object-cover shadow-lg shadow-blue-600/30">
<div class="flex flex-col">
<span class="font-black tracking-tight text-lg text-white">PHL EXPRESS</span>
<span class="text-[10px] tracking-widest text-blue-400 uppercase font-semibold">Operations Portal</span>
</div>
</div>
<nav class="hidden md:flex space-x-6 text-xs font-medium text-slate-300 pl-4 border-l border-slate-800">
<a href="index.html" class="hover:text-white transition">Home</a>
<a href="track.html" class="hover:text-white transition">Track Package</a>
<a href="admin.html" class="hover:text-white transition">Admin Panel</a>
</nav>
</div>
<div>
<a href="admin.html" class="text-xs bg-amber-500/10 border border-amber-500/20 text-amber-400 hover:bg-amber-500/20 px-4 py-2 rounded-xl transition font-medium">View All Records</a>
</div>
</div>
</header>

<!-- Main Content -->
<main class="flex-grow max-w-4xl w-full mx-auto px-6 py-10 space-y-8">

<!-- BOOK NEW SHIPMENT -->
<div class="bg-navy-900 border border-slate-800 p-8 rounded-3xl shadow-xl space-y-6">
<div class="border-b border-slate-800 pb-4">
<h2 class="text-xl font-black tracking-tight text-white">Book New Shipment</h2>
<p class="text-xs text-slate-400">Enter client and destination details below to generate a tracking code and dispatch confirmation email.</p>
</div>

<form onsubmit="handleBookShipment(event)" class="space-y-4 text-xs">
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-1">
<label class="text-slate-300 font-medium">Client Full Name</label>
<input type="text" id="clientName" required placeholder="John Smith" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-600 transition">
</div>
<div class="space-y-1">
<label class="text-slate-300 font-medium">Client Email Address</label>
<input type="email" id="clientEmail" required placeholder="client@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-600 transition">
</div>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-1">
<label class="text-slate-300 font-medium">Recipient Name</label>
<input type="text" id="recipientName" required placeholder="Jane Doe" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-600 transition">
</div>
<div class="space-y-1">
<label class="text-slate-300 font-medium">Destination Country/City</label>
<input type="text" id="destination" required placeholder="London, UK" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-600 transition">
</div>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-1">
<label class="text-slate-300 font-medium">Package Description</label>
<input type="text" id="description" required placeholder="Documents / Electronics" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-600 transition">
</div>
<div class="space-y-1">
<label class="text-slate-300 font-medium">Weight (kg)</label>
<input type="number" step="0.1" id="weight" required placeholder="2.5" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-600 transition">
</div>
</div>

<button type="submit" id="book-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-blue-600/30 text-xs uppercase tracking-wider">
Book Shipment & Generate Tracking ID
</button>
</form>
</div>
</main>

<footer class="bg-navy-950 text-slate-500 py-6 text-center text-xs border-t border-slate-900">
&copy; 2026 Enterprise Logistics Solutions. All rights reserved.
</footer>

<script>
const firebaseConfig = {
apiKey: "AIzaSyBdqx9c9otXv5i1MMrwnPxDoVkJwDySd4",
authDomain: "phl-express.firebaseapp.com",
databaseURL: "https://phl-express-default-rtdb.firebaseio.com",
projectId: "phl-express",
storageBucket: "phl-express.appspot.com",
messagingSenderId: "561028625183",
appId: "1:561028625183:web:ceb8ba2452a79ecdffb62a",
measurementId: "G-838P851DXJ"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function handleBookShipment(e) {
e.preventDefault();

const clientName = document.getElementById("clientName").value.trim();
const clientEmail = document.getElementById("clientEmail").value.trim();
const recipient = document.getElementById("recipientName").value.trim();
const destination = document.getElementById("destination").value.trim();
const description = document.getElementById("description").value.trim();
const weight = document.getElementById("weight").value.trim();

const trackingNumber = "PHL-" + Math.floor(100000 + Math.random() * 900000);
const btn = document.getElementById("book-btn");
btn.innerText = "Processing booking & sending email...";
btn.disabled = true;

const shipmentData = {
trackingNumber: trackingNumber,
clientName: clientName,
clientEmail: clientEmail,
recipient: recipient,
destination: destination,
description: description,
weight: weight,
currentStatus: "Shipment Booked",
createdAt: new Date().toISOString(),
history: [
{
status: "Shipment Booked & Confirmed",
location: "Origin Facility",
timestamp: new Date().toLocaleString()
}
]
};

db.ref("shipments/" + trackingNumber).set(shipmentData)
.then(() => {
const bookingMessage = `Hello ${clientName},\n\nYour shipment to ${destination} for recipient ${recipient} has been booked successfully.\n\nYour Tracking Number is: ${trackingNumber}\n\nYou can track your package status live on our website at any time using this tracking number.`;

emailjs.send("service_q2z18lj", "template_r8be1pc", {
to_name: clientName,
to_email: clientEmail,
subject_title: `Shipment Confirmation (#${trackingNumber})`,
message: bookingMessage
}).catch(err => {
console.warn("Email notification warning:", err);
});

alert("Success! Shipment booked successfully.\nYour Tracking Number: " + trackingNumber);
document.querySelector("form").reset();
btn.innerText = "Book Shipment & Generate Tracking ID";
btn.disabled = false;
})
.catch((err) => {
console.error("Booking error:", err);
alert("Error saving shipment to database. Please try again.");
btn.innerText = "Book Shipment & Generate Tracking ID";
btn.disabled = false;
});
}
</script>
</body>
</html>
