<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHL Express - Create Account</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Firebase App & Services -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<!-- EmailJS SDK -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script type="text/javascript">
emailjs.init("ovl2Qx-zRePZDamA9");
</script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

<!-- Header -->
<header class="p-6 border-b border-slate-900 flex justify-between items-center">
<div class="font-bold text-xl text-blue-500 tracking-wider">PHL EXPRESS</div>
<a href="index.html" class="text-sm text-slate-400 hover:text-white transition">Back to Home</a>
</header>

<!-- Main Signup Box -->
<main class="flex-grow flex items-center justify-center p-4">
<div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 max-w-md w-full shadow-2xl">
<div class="text-center mb-8">
<h1 class="text-2xl font-bold tracking-tight text-white">Create an Account</h1>
<p class="text-sm text-slate-400 mt-1">Join PHL Express to track and manage your shipments easily.</p>
</div>

<form id="signupForm" class="space-y-5">
<div>
<label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Full Name</label>
<input type="text" id="fullName" required placeholder="John Doe" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 transition">
</div>

<div>
<label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Email Address</label>
<input type="email" id="email" required placeholder="name@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 transition">
</div>

<div>
<label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password</label>
<input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 transition">
</div>

<button type="submit" id="signupBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-600/20">
Create Account
</button>
</form>

<div class="text-center mt-6 text-sm text-slate-400">
Already have an account? <a href="login.html" class="text-blue-400 hover:underline font-medium">Log in</a>
</div>
</div>
</main>

<!-- Footer -->
<footer class="py-6 text-center text-xs text-slate-600 border-t border-slate-900">
&copy; 2026 PHL Express Global Logistics. All rights reserved.
</footer>

<!-- Script Logic -->
<script>
// Firebase Configuration
const firebaseConfig = {
apiKey: "AIzaSyBdqx9c9otXv5Si1MMrwnPxDoVkJWdYSd4",
authDomain: "phl-express.firebaseapp.com",
databaseURL: "https://phl-express-default-rtdb.firebaseio.com",
projectId: "phl-express",
storageBucket: "phl-express.firebasestorage.app",
messagingSenderId: "561028625183",
appId: "1:561028625183:web:ceb8ba2452a79ecdffb62a",
measurementId: "G-838P851DXJ"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Signup Form Handler
document.getElementById("signupForm").addEventListener("submit", function(e) {
e.preventDefault();

const fullName = document.getElementById("fullName").value;
const email = document.getElementById("email").value;
const password = document.getElementById("password").value;
const submitBtn = document.getElementById("signupBtn");

submitBtn.innerText = "Creating Account...";
submitBtn.disabled = true;

// 1. Create user in Firebase Auth & save profile to Database
firebase.auth().createUserWithEmailAndPassword(email, password)
.then((userCredential) => {
const userId = userCredential.user.uid;

return db.ref("users/" + userId).set({
fullName: fullName,
email: email,
createdAt: new Date().toISOString()
});
})
.then(() => {
// 2. Send EmailJS using service ID, template ID, parameters, and new public key
const templateParams = {
to_name: fullName,
to_email: email,
message: `Welcome to PHL Express, ${fullName}!\n\nYour client portal account has been successfully created. You can now log in to book and track your shipments seamlessly.\n\nThank you for choosing us!`
};

return emailjs.send("service_q2z18lj", "template_r8be1pc", templateParams, "ovl2Qx-zRePZDamA9");
})
.then((response) => {
console.log("EmailJS Success!", response.status, response.text);
alert("Account created successfully & Welcome email sent!");
window.location.href = "dashboard.html";
})
.catch((error) => {
console.error("Email warning:", error);
alert("Account created successfully! Welcome to your dashboard.");
window.location.href = "dashboard.html";
});
});
</script>
</body>
</html>
