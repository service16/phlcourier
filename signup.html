<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | PHL Express Global Logistics</title>
<link rel="icon" type="image/png" href="logo.png">
<script src="https://cdn.tailwindcss.com"></script>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

<!-- EmailJS SDK -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script type="text/javascript">
emailjs.init("fpalDA0DLYaRkVD0o");
</script>

<script>
tailwind.config = {
theme: {
extend: {
colors: {
navy: { 900: '#0F172A', 950: '#090D16' },
blue: { 600: '#2563EB', 700: '#1D4ED8' }
}
}
}
}
</script>
</head>
<body class="bg-slate-950 font-sans text-slate-300 antialiased min-h-screen flex flex-col justify-between">

<header class="bg-navy-950 border-b border-slate-800">
<div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
<a href="index.html" class="flex items-center space-x-3">
<img src="logo.png" alt="PHL Express Logo" class="h-10 w-10 rounded-xl object-cover shadow-lg shadow-blue-600/30">
<div class="flex flex-col">
<span class="font-black tracking-tight text-lg text-white">PHL EXPRESS</span>
<span class="text-[10px] tracking-widest text-blue-400 uppercase font-semibold">Global Logistics</span>
</div>
</a>
<a href="login.html" class="text-xs text-slate-300 hover:text-white transition font-medium">Already have an account? <span class="text-blue-400 underline">Log In</span></a>
</div>
</header>

<main class="flex-grow flex items-center justify-center px-4 py-12">
<div class="bg-navy-900 border border-slate-800 p-8 rounded-3xl shadow-2xl max-w-md w-full space-y-6 text-white">
<div class="space-y-2 text-center">
<h1 class="text-2xl font-black tracking-tight">Create an Account</h1>
<p class="text-xs text-slate-400">Join PHL Express to track and manage your shipments easily.</p>
</div>

<div id="error-box" class="bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs p-3 rounded-xl hidden"></div>

<form onsubmit="handleSignup(event)" class="space-y-4 text-xs">
<div class="space-y-1">
<label class="text-slate-300 font-medium">Full Name</label>
<input type="text" id="fullname" required placeholder="John Doe" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-600">
</div>

<div class="space-y-1">
<label class="text-slate-300 font-medium">Email Address</label>
<input type="email" id="email" required placeholder="name@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-600">
</div>

<div class="space-y-1">
<label class="text-slate-300 font-medium">Password</label>
<input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-600">
</div>

<button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl transition shadow-lg shadow-blue-600/30 text-sm">
Create Account
</button>
</form>
</div>
</main>

<footer class="bg-navy-950 text-slate-500 py-6 text-center text-xs border-t border-slate-900">
&copy; 2026 PHL Express. All rights reserved.
</footer>

<script>
const firebaseConfig = {
apiKey: "AIzaSyBdqx9c9otXv5Si1MMrwnPxDoVkJWdYSd4",
authDomain: "phl-express.firebaseapp.com",
projectId: "phl-express",
storageBucket: "phl-express.firebasestorage.app",
messagingSenderId: "561028625183",
appId: "1:561028625183:web:ceb8ba2452a79ecdffb62a",
measurementId: "G-838P851DXJ"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function handleSignup(e) {
e.preventDefault();
const name = document.getElementById("fullname").value;
const email = document.getElementById("email").value;
const password = document.getElementById("password").value;
const errBox = document.getElementById("error-box");
const btn = document.getElementById("submit-btn");

errBox.classList.add("hidden");
btn.innerText = "Creating account & sending confirmation...";

auth.createUserWithEmailAndPassword(email, password)
.then((cred) => {
return db.collection("users").doc(cred.user.uid).set({
fullName: name,
email: email,
role: "client",
createdAt: new Date().toISOString()
});
})
.then(() => {
return emailjs.send("service_q2z18lj", "jrxtuv9", {
to_name: name,
to_email: email,
message_title: "Account Successfully Created!",
message_body: "Welcome to PHL Express Global Logistics! Your account has been successfully created and approved for shipping management."
});
})
.then(() => {
window.location.href = "dashboard.html";
})
.catch((err) => {
errBox.innerText = err.message;
errBox.classList.remove("hidden");
btn.innerText = "Create Account";
});
}
</script>
</body>
</html>
