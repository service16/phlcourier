<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | PHL Express Global Logistics</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" type="image/png" href="logo.png">

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

<!-- EmailJS SDK -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script type="text/javascript">
emailjs.init("fpa1DA0DLYaRkVd0o");
</script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center px-4">
<div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl space-y-6">
<div class="text-center space-y-2">
<h1 class="text-2xl font-bold tracking-tight text-white">PHL Express Portal</h1>
<p class="text-xs text-slate-400">Sign in to access your dashboard and manage operations.</p>
</div>

<div id="error-box" class="hidden bg-rose-950/50 border border-rose-800 text-rose-300 text-xs p-3 rounded-xl"></div>

<form onsubmit="handleLogin(event)" class="space-y-4">
<div>
<label class="block text-xs font-medium text-slate-400 mb-1">Email Address</label>
<input type="email" id="email" required autocomplete="email" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500">
</div>
<div>
<label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
<input type="password" id="password" required autocomplete="current-password" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500">
</div>
<button type="submit" id="submit-btn" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-medium py-3 rounded-xl text-sm transition shadow-lg">Login</button>
</form>

<div class="text-center">
<a href="index.html" class="text-xs text-slate-400 hover:text-white transition">Back to Home</a>
</div>
</div>

<script>
const firebaseConfig = {
apiKey: "AIzaSyBdqx9c9otXv5i1MMrwnPxDoVkJwDySd4",
authDomain: "phl-express.firebaseapp.com",
databaseURL: "https://phl-express-default-rtdb.firebaseio.com",
projectId: "phl-express",
storageBucket: "phl-express.appspot.com",
messagingSenderId: "561028625183",
appId: "1:561028625183:web:ceb8ba2452a79ecdffb62a",
measurementId: "G-838P851DXJ"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function handleLogin(e) {
e.preventDefault();
const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value;
const errBox = document.getElementById("error-box");
const btn = document.getElementById("submit-btn");

errBox.classList.add("hidden");
btn.innerText = "Logging in...";
btn.disabled = true;

auth.signInWithEmailAndPassword(email, password)
.then((userCredential) => {
const user = userCredential.user;

const loginParams = {
to_name: user.email.split('@')[0],
to_email: user.email,
subject_title: "Security Alert: New Login",
message: `A new login to your account was detected on ${new Date().toLocaleString()}. If this was you, you can safely ignore this message.`
};

emailjs.send("service_q2z18lj", "template_r8be1pc", loginParams, "ovl2Qx-zRePZDamA9")
.catch((err) => console.log("Login email error:", err));

window.location.href = "dashboard.html";
})
.catch((error) => {
btn.innerText = "Login";
btn.disabled = false;
errBox.innerText = error.message;
errBox.classList.remove("hidden");
});
}
</script>
</body>
</html>
