<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In | PHL Express Global Logistics</title>
<link rel="icon" type="image/png" href="logo.png">
<script src="https://cdn.tailwindcss.com"></script>

<!-- Firebase App Core & Firestore Compat SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

<script>
tailwind.config = {
theme: {
extend: {
colors: {
navy: { 900: '#0F172A', 950: '#090D16' },
blue: { 600: '#2563EB', 700: '#1D4ED8' }
}
}
}
}
</script>
</head>
<body class="bg-slate-950 font-sans text-slate-600 antialiased min-h-screen flex flex-col justify-between">

<!-- Top Bar -->
<header class="bg-navy-950 border-b border-slate-800">
<div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
<a href="index.html" class="flex items-center space-x-3">
<img src="logo.png" alt="PHL Express Logo" class="h-10 w-10 rounded-xl object-cover shadow-lg shadow-blue-600/30">
<div class="flex flex-col">
<span class="font-black tracking-tight text-lg text-white">PHL EXPRESS</span>
<span class="text-[10px] tracking-widest text-blue-400 uppercase font-semibold">Global Logistics</span>
</div>
</a>
<a href="signup.html" class="text-xs text-slate-300 hover:text-white transition font-medium">New user? <span class="text-blue-400 underline">Sign Up</span></a>
</div>
</header>

<!-- Main Login Form Container -->
<main class="flex-grow flex items-center justify-center px-4 py-12">
<div class="bg-navy-900 border border-slate-800 p-8 rounded-3xl shadow-2xl max-w-md w-full space-y-6 text-white">
<div class="space-y-2 text-center">
<h1 class="text-2xl font-black tracking-tight">Welcome Back</h1>
<p class="text-xs text-slate-400">Log in to manage your shipments and account details.</p>
</div>

<div id="error-box" class="bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs p-3 rounded-xl hidden"></div>

<form onsubmit="handleLogin(event)" class="space-y-4 text-xs">
<div class="space-y-1">
<label class="text-slate-300 font-medium">Email Address</label>
<input type="email" id="email" required placeholder="name@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-600">
</div>

<div class="space-y-1">
<label class="text-slate-300 font-medium">Password</label>
<input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-600">
</div>

<button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl transition shadow-lg shadow-blue-600/30 text-sm">
Log In
</button>
</form>
</div>
</main>

<!-- Footer -->
<footer class="bg-navy-950 text-slate-500 py-6 text-center text-xs border-t border-slate-900">
&copy; 2026 PHL Express. All rights reserved.
</footer>

<script>
const firebaseConfig = {
apiKey: "AIzaSyAp5Xbup9qdNplMzkQPgeu49ZFjq0RLgko",
authDomain: "phl-courier.firebaseapp.com",
projectId: "phl-courier",
storageBucket: "phl-courier.firebasestorage.app",
messagingSenderId: "858130682931",
appId: "1:858130682931:web:8493a4470a9e0e5827bf46",
measurementId: "G-5SRRPR6PTY"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function handleLogin(e) {
e.preventDefault();
const email = document.getElementById("email").value;
const password = document.getElementById("password").value;
const errBox = document.getElementById("error-box");
const btn = document.getElementById("submit-btn");

errBox.classList.add("hidden");
btn.innerText = "Logging in...";

auth.signInWithEmailAndPassword(email, password)
.then(() => {
window.location.href = "index.html";
})
.catch((err) => {
errBox.innerText = err.message;
errBox.classList.remove("hidden");
btn.innerText = "Log In";
});
}
</script>
</body>
</html>
